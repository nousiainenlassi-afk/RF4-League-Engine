[project]
name = "rf4-league-engine"
version = "0.1.0"
description = "RF4 League Engine generator and scheduler package."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Lassi Nousiainen" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/nousiainenlassi-afk/RF4-League-Engine"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
